<!-- 云台 PTZ 测试页 - 独立测试云台 WebSocket 通信 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云台控制面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            min-height: 100vh;
        }

        /* ── 顶栏 ── */
        .header {
            background: linear-gradient(135deg, #1a2a3a 0%, #0f1923 100%);
            padding: 16px 28px;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #4fc3f7;
        }

        .connection-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #555; transition: background 0.3s;
        }
        .status-dot.connected { background: #00e676; box-shadow: 0 0 8px #00e67688; }
        .status-dot.connecting { background: #ffc107; animation: pulse 1s infinite; }
        .status-dot.error { background: #ff5252; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .status-text { font-size: 13px; color: #8899aa; min-width: 80px; }

        .ws-url-input {
            background: #1a2a3a; border: 1px solid #2a4a6a; border-radius: 6px;
            color: #e0e6ed; padding: 7px 12px; font-size: 13px; width: 240px;
            outline: none; transition: border-color 0.3s;
        }
        .ws-url-input:focus { border-color: #4fc3f7; }

        .btn {
            padding: 7px 20px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; user-select: none;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-connect { background: #1565c0; color: #fff; }
        .btn-connect:hover:not(:disabled) { background: #1976d2; }
        .btn-disconnect { background: #c62828; color: #fff; }
        .btn-disconnect:hover:not(:disabled) { background: #d32f2f; }

        /* ── 主体布局 ── */
        .main-content {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── 卡片通用 ── */
        .card {
            background: linear-gradient(180deg, #1a2a3a 0%, #152232 100%);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: #4fc3f7; }

        .card-title {
            font-size: 12px; color: #6b8299; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 14px;
        }

        /* ── 顶行布局：角度 + 旋转 ── */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* ── 角度卡片（合并） ── */
        .angle-card {
            background: linear-gradient(180deg, #1a2a3a 0%, #152232 100%);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 20px;
            transition: border-color 0.3s;
        }
        .angle-card:hover { border-color: #4fc3f7; }

        .angle-item { text-align: center; }
        .angle-item + .angle-item {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #1e3a5f;
        }

        .angle-item .label {
            font-size: 12px; color: #6b8299;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px;
        }
        .angle-item .value {
            font-size: 38px; font-weight: 700;
            font-variant-numeric: tabular-nums; transition: color 0.3s;
        }
        .angle-item .unit { font-size: 14px; font-weight: 400; color: #6b8299; margin-left: 4px; }

        .angle-item-h .value { color: #4fc3f7; }
        .angle-item-v .value { color: #66bb6a; }
        .angle-item-h .fill { background: #4fc3f7; }
        .angle-item-v .fill { background: #66bb6a; }

        /* ── 限位指示条 ── */
        .limit-bar {
            margin-top: 10px;
            position: relative;
            height: 8px;
            background: #0f1923;
            border-radius: 4px;
            overflow: visible;
        }
        .limit-bar .fill {
            position: absolute; height: 100%; border-radius: 4px;
            transition: left 0.3s, width 0.3s;
        }

        .limit-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #556677; margin-top: 4px;
        }

        /* ── 绝对角度输入 ── */
        .angle-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex; align-items: center; gap: 10px;
        }

        .input-row label {
            font-size: 13px; color: #6b8299; min-width: 70px; text-align: right;
        }

        .angle-input {
            background: #0f1923; border: 1px solid #2a4a6a; border-radius: 6px;
            color: #e0e6ed; padding: 8px 12px; font-size: 14px;
            width: 100px; outline: none; transition: border-color 0.3s;
        }
        .angle-input:focus { border-color: #4fc3f7; }

        .input-unit { font-size: 13px; color: #556677; }

        .btn-action {
            padding: 8px 18px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; margin-top: 6px;
        }

        .btn-rotate {
            background: #1565c0; color: #fff;
        }
        .btn-rotate:hover:not(:disabled) { background: #1976d2; }

        .btn-search {
            background: #e65100; color: #fff;
        }
        .btn-search:hover:not(:disabled) { background: #ef6c00; }

        .btn-e-stop {
            background: #b71c1c; color: #fff;
            padding: 10px 28px; font-size: 14px; font-weight: 700;
        }
        .btn-e-stop:hover:not(:disabled) { background: #c62828; }

        /* ── 功能按钮区 ── */
        .action-buttons {
            display: flex; flex-wrap: wrap; gap: 10px;
            margin-top: 8px;
        }

        /* ── 日志区 ── */
        .log-container {
            background: #0a1018; border-radius: 8px;
            padding: 12px 14px; height: 160px;
            overflow-y: auto;
            font-family: "Cascadia Code", "Fira Code", monospace;
            font-size: 12px; line-height: 1.7;
        }
        .log-container::-webkit-scrollbar { width: 5px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 3px; }

        .log-entry { opacity: 0.9; }
        .log-entry .time { color: #556677; }
        .log-entry.status { color: #4fc3f7; }
        .log-entry.data { color: #66bb6a; }
        .log-entry.warning { color: #ffa726; }
        .log-entry.error { color: #ff5252; }

        /* ── 响应式 ── */
        @media (max-width: 700px) {
            .top-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>云台控制面板</h1>
    <div class="connection-panel">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">未连接</span>
        <input type="text" class="ws-url-input" id="wsUrl" value="ws://localhost:8765/ws/ptz" placeholder="WebSocket 地址">
        <button class="btn btn-connect" id="btnConnect" onclick="connectWS()">连接</button>
        <button class="btn btn-disconnect" id="btnDisconnect" onclick="disconnectWS()" disabled>断开</button>
    </div>
</div>

<div class="main-content">
    <!-- 角度 + 旋转同行 -->
    <div class="top-row">
        <!-- 角度显示（合并） -->
        <div class="angle-card">
            <div class="angle-item angle-item-h">
                <div class="label">水平角度</div>
                <div class="value" id="hAngle">--<span class="unit">°</span></div>
                <div class="limit-bar">
                    <div class="fill" id="hFill" style="left:0%;width:0%"></div>
                </div>
                <div class="limit-labels"><span>0°</span><span>360°</span></div>
            </div>
            <div class="angle-item angle-item-v">
                <div class="label">垂直角度</div>
                <div class="value" id="vAngle">--<span class="unit">°</span></div>
                <div class="limit-bar">
                    <div class="fill" id="vFill" style="left:0%;width:0%"></div>
                </div>
                <div class="limit-labels"><span>-90°</span><span>+90°</span></div>
            </div>
        </div>

        <!-- 角度旋转 + 快捷操作 -->
        <div class="card">
        <div class="card-title">角度旋转</div>
        <div class="angle-input-group">
            <div class="input-row">
                <label>水平角度</label>
                <input type="number" class="angle-input" id="targetH" value="0" step="1" min="0" max="360">
                <span class="input-unit">°</span>
            </div>
            <div class="input-row">
                <label>垂直角度</label>
                <input type="number" class="angle-input" id="targetV" value="0" step="1" min="-90" max="90">
                <span class="input-unit">°</span>
            </div>
            <div class="action-buttons">
                <button class="btn-action btn-rotate" onclick="rotateAbsolute()">旋转到目标</button>
            </div>
        </div>

        <div class="card-title" style="margin-top:18px">快捷操作</div>
        <div class="action-buttons">
            <button class="btn-action btn-search" onclick="sendAction('search')">右转搜索</button>
            <button class="btn-action btn-e-stop" onclick="emergencyStop()">急 停</button>
        </div>
    </div>
    </div>

    <!-- 日志 -->
    <div class="card">
        <div class="card-title">消息日志</div>
        <div class="log-container" id="logContainer"></div>
    </div>
</div>

<script>
    let ws = null;
    let lastAngleLogKey = null;
    let lastAngleLogEl = null;
    let lastAngleCount = 0;

    // ── UI 更新 ──

    function updateAngleDisplay(data) {
        const h = data.horizontal_angle;
        const v = data.vertical_angle;

        document.getElementById('hAngle').innerHTML =
            (h >= 0 ? '+' : '') + h.toFixed(1) + '<span class="unit">°</span>';
        document.getElementById('vAngle').innerHTML =
            (v >= 0 ? '+' : '') + v.toFixed(1) + '<span class="unit">°</span>';

        // 限位指示条
        const hPct = Math.max(0, Math.min(100, (h / 360) * 100));
        document.getElementById('hFill').style.left = '0%';
        document.getElementById('hFill').style.width = hPct + '%';

        const vPct = Math.max(0, Math.min(100, ((v + 90) / 180) * 100));
        document.getElementById('vFill').style.left = '0%';
        document.getElementById('vFill').style.width = vPct + '%';
    }

    // ── 控制发送 ──

    function sendJSON(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
        }
    }

    function emergencyStop() {
        sendJSON({ action: "emergency_stop" });
    }

    function rotateAbsolute() {
        const h = parseFloat(document.getElementById('targetH').value) || 0;
        const v = parseFloat(document.getElementById('targetV').value) || 0;
        sendJSON({ action: "rotate_absolute", h: h, v: v });
    }

    function sendAction(action) {
        sendJSON({ action: action });
    }

    // ── 状态 ──

    function setStatus(state, text) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        dot.className = 'status-dot ' + state;
        txt.textContent = text;
    }

    // ── 日志 ──

    function addLog(type, message) {
        const container = document.getElementById('logContainer');
        const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        const entry = document.createElement('div');
        entry.className = 'log-entry ' + type;
        entry.innerHTML = `<span class="time">[${now}]</span> ${message}`;
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
        while (container.children.length > 200) {
            const removed = container.firstChild;
            if (removed === lastAngleLogEl) {
                lastAngleLogEl = null;
                lastAngleLogKey = null;
                lastAngleCount = 0;
            }
            container.removeChild(removed);
        }
        return entry;
    }

    // ── WebSocket ──

    function connectWS() {
        const url = document.getElementById('wsUrl').value.trim();
        if (!url) return;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close();
        }

        setStatus('connecting', '连接中...');
        addLog('status', '正在连接 ' + url);

        ws = new WebSocket(url);

        ws.onopen = () => {
            setStatus('connected', '已连接');
            addLog('status', 'WebSocket 连接成功');
            document.getElementById('btnConnect').disabled = true;
            document.getElementById('btnDisconnect').disabled = false;
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);

                switch (msg.type) {
                    case 'angle_data':
                        updateAngleDisplay(msg.data);
                        // 日志合并
                        const hStr = (msg.data.horizontal_angle >= 0 ? '+' : '') + msg.data.horizontal_angle.toFixed(1);
                        const vStr = (msg.data.vertical_angle >= 0 ? '+' : '') + msg.data.vertical_angle.toFixed(1);
                        const logKey = hStr + '|' + vStr;

                        if (logKey === lastAngleLogKey && lastAngleLogEl) {
                            lastAngleCount++;
                            const now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
                            const baseText = `水平: ${hStr}°  垂直: ${vStr}°`;
                            lastAngleLogEl.innerHTML =
                                `<span class="time">[${now}]</span> ${baseText}` +
                                `<span style="color:#ffa726;margin-left:8px">×${lastAngleCount}</span>`;
                        } else {
                            lastAngleLogKey = logKey;
                            lastAngleCount = 1;
                            const baseText = `水平: ${hStr}°  垂直: ${vStr}°`;
                            lastAngleLogEl = addLog('data', baseText);
                        }
                        break;

                    case 'status':
                        addLog('status', msg.message);
                        lastAngleLogKey = null;
                        lastAngleLogEl = null;
                        lastAngleCount = 0;
                        break;

                    case 'warning':
                        addLog('warning', msg.message);
                        lastAngleLogKey = null;
                        lastAngleLogEl = null;
                        lastAngleCount = 0;
                        break;

                    case 'error':
                        addLog('error', msg.message);
                        lastAngleLogKey = null;
                        lastAngleLogEl = null;
                        lastAngleCount = 0;
                        break;
                }
            } catch (e) {
                addLog('warning', '收到非 JSON 消息: ' + event.data);
            }
        };

        ws.onclose = () => {
            setStatus('', '已断开');
            addLog('error', 'WebSocket 连接已关闭');
            document.getElementById('btnConnect').disabled = false;
            document.getElementById('btnDisconnect').disabled = true;
        };

        ws.onerror = () => {
            setStatus('error', '连接失败');
            addLog('error', 'WebSocket 连接出错');
        };
    }

    function disconnectWS() {
        if (ws) {
            ws.close();
            ws = null;
        }
        setStatus('', '未连接');
        document.getElementById('btnConnect').disabled = false;
        document.getElementById('btnDisconnect').disabled = true;
        addLog('status', '已手动断开连接');
    }

    // 页面关闭时断开
    window.addEventListener('beforeunload', () => {
        if (ws) ws.close();
    });
</script>

</body>
</html>
