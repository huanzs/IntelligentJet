<!-- WebSocket 服务首页 - 服务状态和端口展示 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备控制中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #4fc3f7;
        }
        .cards {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: linear-gradient(180deg, #1a2a3a 0%, #152232 100%);
            border: 1px solid #1e3a5f;
            border-radius: 16px;
            padding: 36px 44px;
            text-align: center;
            transition: border-color 0.3s, transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            min-width: 220px;
        }
        .card:hover { border-color: #4fc3f7; transform: translateY(-4px); }
        .card .icon { font-size: 48px; margin-bottom: 16px; }
        .card .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .card .desc { font-size: 13px; color: #6b8299; }
    </style>
</head>
<body>
    <h1>设备控制中心</h1>
    <div class="cards">
        <a class="card" href="/static/slm.html">
            <div class="icon">🎯</div>
            <div class="title">消防炮控制</div>
            <div class="desc">SLM 角度监控与方向控制</div>
        </a>
        <a class="card" href="/static/ptz.html">
            <div class="icon">📹</div>
            <div class="title">云台控制</div>
            <div class="desc">PTZ 角度查询与旋转控制</div>
        </a>
    </div>
</body>
</html>
